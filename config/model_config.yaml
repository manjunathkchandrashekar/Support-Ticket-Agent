provider: local
model: keyword-rag-policy-engine
embedding_model: lexical-tfidf

llm:
  provider: openai
  model: gpt-4o-mini
  temparature: 0.2
  max_tokens: 800

embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536

sentiment_model:
  provider: openai
  model: gpt-4o-mini
  temparature: 0.2

vector_store:
  backend: faiss
  index_path: outputs/vector_index
  top_k: 4
